<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mein Portfolio</title>
  </head>
  <body>
    <header>
      <h1>Mein Portfolio</h1>
      <nav aria-label="Hauptnavigation">
        <a href="#ueber-mich">Über mich</a>
        <a href="#projekte">Projekte</a>
      </nav>
    </header>

    <main>
      <section id="ueber-mich">
        <h2>Über mich</h2>
        <p>Hallo! Mein Name ist Maid Kero und ich bin Softwareentwickler. Hier präsentiere ich meine Projekte und Applikationen.</p>
      </section>

      <section id="projekte">
        <h2>Meine Projekte</h2>

        <!-- Filter-Buttons -->
        <div class="filter-leiste" role="group" aria-label="Projekte nach Kategorie filtern">
          <button class="filter-btn" data-kategorie="Alle">Alle</button>
          <button class="filter-btn" data-kategorie="Mobile">Mobile</button>
          <button class="filter-btn" data-kategorie="Embedded">Embedded</button>
          <button class="filter-btn" data-kategorie="Frontend">Frontend</button>
        </div>
        
        <div id="projekte-liste"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mein Portfolio</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
